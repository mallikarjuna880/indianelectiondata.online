services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: election_user
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: election_data
    ports:
      - "5432:5432"
    volumes:
      - election_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U election_user -d election_data"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  election_pg:
