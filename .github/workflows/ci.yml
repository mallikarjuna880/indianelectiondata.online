name: backend-ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: election_user
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: election_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U election_user -d election_data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://election_user:change-me@localhost:5432/election_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:seed
      - name: Start API
        run: npm run start --workspace apps/api &
      - name: Health check
        run: node -e "fetch('http://localhost:4000/health').then(async r=>{if(!r.ok) process.exit(1); console.log(await r.text())}).catch(()=>process.exit(1))"
